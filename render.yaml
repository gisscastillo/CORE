services:
  - type: web
    name: core-testing
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: core-testing-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: BCRYPT_ROUNDS
        value: "12"

databases:
  - name: core-testing-db
    plan: free
    databaseName: core_db
    user: core_user
