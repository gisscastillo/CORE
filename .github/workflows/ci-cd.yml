name: CORE CI/CD

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas y umbral de cobertura
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      - name: Publicar evidencia de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-test-reports
          path: reports/unit-tests/

  sonarcloud:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      - name: Analizar en SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  deploy-testing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, sonarcloud]
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - name: Verificar Auto-Deploy de Render
        env:
          TEST_ENV_URL: https://core-testing-0r6l.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          echo "Esperando el Auto-Deploy del commit $EXPECTED_COMMIT"
          for attempt in $(seq 1 30); do
            deployed_commit=$(curl --fail --silent "$TEST_ENV_URL/api/health" | jq -r '.version // empty' || true)
            if [ "$deployed_commit" = "$EXPECTED_COMMIT" ]; then
              echo "Entorno de prueba actualizado y saludable."
              exit 0
            fi
            echo "Intento $attempt/30: Render todavía publica $deployed_commit"
            sleep 10
          done
          echo "Render no publicó el commit esperado dentro del tiempo de verificación." >&2
          exit 1
