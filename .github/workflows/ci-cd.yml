name: CORE CI/CD

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas y umbral de cobertura
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      - name: Publicar evidencia de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-unit-test-reports
          path: reports/unit-tests/

  sonarcloud:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      - name: Analizar en SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  deploy-testing:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, sonarcloud]
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - name: Solicitar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
