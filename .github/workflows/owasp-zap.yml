name: CORE OWASP ZAP Full Scan

on:
  workflow_run:
    workflows: ['CORE CI/CD']
    types: [completed]
  workflow_dispatch:
    inputs:
      target_url:
        description: URL pública del entorno de prueba
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap-full-scan:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           !contains(github.event.workflow_run.head_commit.message, '[skip zap]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear directorio de reportes
        run: mkdir -p reports/security
      - name: Escaneo OWASP ZAP
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ inputs.target_url || 'https://core-testing-0r6l.onrender.com' }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j'
          artifact_name: core-owasp-zap-report
          allow_issue_writing: false
